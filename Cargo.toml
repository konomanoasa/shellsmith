[package]
name = "konomanoasa-shellsmith"
version = "0.5.0"
description = "CLI and LSP for shell scripts."
readme = "README.md"
license = "MIT"
repository = "https://github.com/konomanoasa/shellsmith"
edition = "2024"

[lib]
name = "shellsmith"

[[bin]]
name = "shellsmith"
path = "src/main.rs"

[dependencies]
async-lsp = { version = "=0.2.4", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "io"] }
ignore = "=0.4.33"
imbl = "=7.0.2"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "io-std", "io-util", "sync"] }
tower = { version = "=0.5.3", default-features = false }
typed-arena = "=2.0.2"
tree-sitter = "=0.27.1"
tree-sitter-sh = "=0.27.0"
unicode-width = { version = "=0.2.3", default-features = false }
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "time"] }

[[bench]]
name = "engine"
path = "tests/performance/engine.rs"
harness = false

[[bench]]
name = "lsp"
path = "tests/performance/lsp.rs"
harness = false

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
